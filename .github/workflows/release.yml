name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone sibling dsh-maestro-config-lib (workspace dep)
        run: |
          if [ ! -d ../dsh-maestro-config-lib ]; then
            git clone --depth 1 https://github.com/ddtcorex/dsh-maestro-config-lib.git ../dsh-maestro-config-lib
          fi
          ls -la ../dsh-maestro-config-lib | head -20

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Require flat lib/index.js
        run: test -f lib/index.js

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$version" '
              /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found=1; next } }
              found { print }
            ' CHANGELOG.md > release-notes.md || true
            cat release-notes.md
          else
            echo "$GITHUB_REF_NAME" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
