# dsh-maestro-devkit bundle patch: general development toolkit for DSH
# Host isolate realm + Client overlay. Tunnel-aware (local + https://dsh-company.ddtcorex.com).
- insert:
    - id: maestro-devkit
      name: '@ddtcorex/dsh-maestro-devkit'
      isolate: devkit
      inject: ['tools', 'connection']
      config:
        targetUrl: auto
        watch: true
        verifyTunnel: true
